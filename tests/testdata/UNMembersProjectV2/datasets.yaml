min_sunstone_version: 1.20.0
package:
  title: UN Member States Dataset
  description: |
    Processed data from the official UN Member States Authority File,
    providing clean, standardized information about current UN members.
  version: "1.0.0"
  keywords:
    - united-nations
    - member-states
    - international-organizations
  licenses:
    - name: CC-BY-NC-3.0-IGO
  contributors:
    - title: Sunstone Institute
      roles:
        - creator
        - publisher

publish:
  enabled: true
  to: gs://example-bucket/datasets/un-members/

inputs:
  - title: Official UN Member States
    name: official-un-member-states
    path: inputs/official_un_member_states_raw.csv
    source:
      title: United Nations Member States Authority File
      dcat:downloadURL: https://digitallibrary.un.org/record/4082085/files/member_states_auths_2025-10-08.csv
      rdfs:seeAlso: https://digitallibrary.un.org/record/4082085/files/2025-10-08_UN%2520member%2520states.md
      dcat:landingPage: https://digitallibrary.un.org/record/4082085
      prov:wasAttributedTo: "United Nations Dag Hammarskjöld Library"
      dct:license: CC-BY-NC-3.0-IGO
    prov:generatedAtTime: '2025-10-08'
    prov:wasGeneratedBy:
      '@type': prov:Activity
      dct:type: manual-download
    schema:
      fields:
        - name: Member State
          type: string
        - name: M49 Code
          type: string
        - name: ISO Code
          type: string
        - name: Start date
          type: date
        - name: End date
          type: date
        - name: Other Names
          type: string
        - name: Earlier or Later Name
          type: string
        - name: Earlier (a) or Later (b)
          type: string
        - name: Geographic Term
          type: string
        - name: Membership Document Symbol
          type: string
        - name: Scope Note
          type: string
        - name: French
          type: string
        - name: Spanish
          type: string
        - name: Arabic
          type: string
        - name: Chinese
          type: string
        - name: Russian
          type: string
  - title: UN Member States Sample (JSON)
    name: un-member-states-sample-json
    path: inputs/un_member_states_sample.json
    schema:
      fields:
        - name: Member State
          type: string
        - name: ISO Code
          type: string
        - name: M49 Code
          type: string
  - title: UN Member States Sample (Excel)
    name: un-member-states-sample-excel
    path: inputs/un_member_states_sample.xlsx
    schema:
      fields:
        - name: Member State
          type: string
        - name: M49 Code
          type: string
        - name: ISO Code
          type: string
        - name: Start date
          type: date
        - name: End date
          type: date
        - name: Other Names
          type: string
        - name: Earlier or Later Name
          type: string
        - name: Earlier (a) or Later (b)
          type: string
        - name: Geographic Term
          type: string
        - name: Membership Document Symbol
          type: string
        - name: Scope Note
          type: string
        - name: French
          type: string
        - name: Spanish
          type: string
        - name: Arabic
          type: string
        - name: Chinese
          type: string
        - name: Russian
          type: string
outputs:
  - title: Current UN Member States
    name: current-un-member-states
    path: outputs/current_un_member_states.csv
    schema:
      fields:
        - name: Country
          type: string
        - name: Alpha-2 Code
          type: string
        - name: Alpha-3 Code
          type: string
        - name: Date of Admission
          type: date
        - name: version
          type: string
