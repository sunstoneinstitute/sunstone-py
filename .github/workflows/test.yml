name: Tests

on:
  push:
    branches: [ main ]
    tags-ignore:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main ]

jobs:
  check-skip:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.check.outputs.should_skip }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 2

      - name: Check if release commit
        id: check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^Release\ v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD | sort)
            EXPECTED=$'CHANGELOG.md\npyproject.toml\nuv.lock'
            if [[ "$CHANGED_FILES" == "$EXPECTED" ]]; then
              echo "should_skip=true" >> "$GITHUB_OUTPUT"
              echo "Skipping tests: release commit with no code changes"
              exit 0
            fi
          fi
          echo "should_skip=false" >> "$GITHUB_OUTPUT"

  lint:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: |
        uv venv
        uv sync

    - name: Run ruff linter
      run: uv run ruff check src/sunstone

    - name: Run ruff formatter check
      run: uv run ruff format --check src/sunstone

    - name: Run mypy
      run: uv run mypy src/sunstone

  test:
    needs: check-skip
    if: needs.check-skip.outputs.should_skip != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

    - name: Install uv
      uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv
        uv sync

    - name: Run tests with pytest
      run: |
        uv run pytest --cov=sunstone --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe # v5
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
