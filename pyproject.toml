[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "sunstone-py"
version = "1.13.2"
description = "Python library for managing datasets with lineage tracking in Sunstone projects"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Sunstone Institute", email = "stig@sunstone.institute" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.15",
    "frictionless>=5.18.1",
    "google-auth>=2.43.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "pyyaml>=6.0",
    "ruamel-yaml>=0.18",
    "pyarrow>=23.0.1",
    "tomlkit>=0.12.0",
    "pint>=0.24",
]

[project.optional-dependencies]
gcs = [
    "google-cloud-storage>=2.0",
]
s3 = [
    "boto3>=1.28",
]
qudt = [
    "ontopint>=0.1",
]
zarr = [
    "zarr>=2.18",
]
hdf5 = [
    "h5py>=3.10",
]
geo = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyogrio>=0.8",
    "topojson>=1.9",
]

[project.license]
text = "MIT"

[project.urls]
Homepage = "https://github.com/sunstoneinstitute/sunstone-py"
Documentation = "https://sunstoneinstitute.github.io/sunstone-py/"
Repository = "https://github.com/sunstoneinstitute/sunstone-py"

[project.scripts]
sunstone = "sunstone.cli:app"

[tool.setuptools.packages.find]
where = [
    "src",
]

[tool.setuptools.package-data]
sunstone = [
    "py.typed",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = false
exclude = [
    "^tests/testdata/",
    "^templates/",
]
overrides = [
    { module = "tests.*", disallow_untyped_defs = false },
    { module = "ontopint", ignore_missing_imports = true },
    { module = "zarr", ignore_missing_imports = true },
    { module = "h5py", ignore_missing_imports = true },
]

[tool.pytest.ini_options]
addopts = "--cov=sunstone --cov-report=term"
norecursedirs = [
    ".worktrees",
    ".claude",
]

[tool.coverage.run]
omit = [
    "scripts/release.py",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "pandas-stubs>=2.3.2.250926",
    "types-pyyaml>=6.0.12.20250915",
    "markdown>=3.10",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mike>=2.1.0",
]
